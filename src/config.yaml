site:
  name: Xuanbao Environmental
  site: 'https://xuanbaoenvironment.com'
  base: '/'
  trailingSlash: true

# Default SEO metadata
metadata:
  title:
    default: 'Industrial Environmental & Purification Materials Manufacturer | Xuanbao Environmental'
    template: '%s | Xuanbao Environmental'
  description: 'Yancheng Xuanbao Environmental Technology Co., Ltd. manufactures VOC catalysts, SCR DeNOx catalysts, CO oxidation catalysts, activated carbon and zeolite molecular sieves for industrial gas treatment, water purification and process applications.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Xuanbao Environmental
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'dark:only'
